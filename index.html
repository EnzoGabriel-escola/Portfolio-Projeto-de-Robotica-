<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio Tinkercad</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="header-badge">TINKERCAD LABS</div>
        <h1>Meu Portfólio <span>Tinkercad</span></h1>
        <p>Projetos 3D e Circuitos salvos com visualização de imagem</p>
    </header>

    <!-- Formulário para adicionar links -->
    <div class="form-container">
        <h2>Adicionar Novo Projeto</h2>
        <form id="project-form" class="input-group">
            <input type="text" id="project-title" placeholder="Nome do Projeto (Ex: Robô Seguidor de Linha)" required autocomplete="off">
            <input type="url" id="project-url" placeholder="Link do Projeto no Tinkercad" required autocomplete="off">
            <button type="submit" class="btn-add">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Adicionar
            </button>
        </form>
    </div>

    <!-- Container dos Projetos -->
    <main class="projects-grid" id="projects-container">
        <!-- Os cards com imagem e link aparecerão aqui -->
    </main>

    <script>
        const form = document.getElementById('project-form');
        const container = document.getElementById('projects-container');

        document.addEventListener('DOMContentLoaded', loadProjects);

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('project-title').value.trim();
            let rawUrl = document.getElementById('project-url').value.trim();

            // Garante link de incorporação para visualização interativa
            let embedUrl = rawUrl;
            if (rawUrl.includes('tinkercad.com/things/') && !rawUrl.includes('/embed')) {
                embedUrl = rawUrl.replace(/\/things\/([^\/-]+).*/, '/embed/$1');
            }

            // Gera URL automatizada da imagem prévia usando a API Microlink
            const imageUrl = `https://api.microlink.io/?url=${encodeURIComponent(embedUrl)}&screenshot=true&meta=false&embed=screenshot.url`;

            const newProject = {
                id: Date.now(),
                title: title,
                url: embedUrl,
                originalUrl: rawUrl,
                image: imageUrl
            };

            saveProject(newProject);
            form.reset();
        });

        function saveProject(project) {
            const projects = getProjectsFromStorage();
            projects.push(project);
            localStorage.setItem('tinkercad_projects', JSON.stringify(projects));
            renderProjects();
        }

        function getProjectsFromStorage() {
            return JSON.parse(localStorage.getItem('tinkercad_projects')) || [];
        }

        function deleteProject(id) {
            let projects = getProjectsFromStorage();
            projects = projects.filter(project => project.id !== id);
            localStorage.setItem('tinkercad_projects', JSON.stringify(projects));
            renderProjects();
        }

        function loadProjects() {
            renderProjects();
        }

        function renderProjects() {
            container.innerHTML = '';
            const projects = getProjectsFromStorage();

            if (projects.length === 0) {
                container.innerHTML = `
                    <div class="empty-message">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        <p>Nenhum projeto cadastrado no seu laboratório.</p>
                        <span>Adicione o link de um projeto no formulário acima para começar!</span>
                    </div>
                `;
                return;
            }

            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="image-container">
                        <img src="${project.image}" alt="Prévia do projeto ${project.title}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x250/15171a/facc15?text=Projeto+Tinkercad';">
                        <a href="${project.url}" target="_blank" class="overlay-link">
                            <span>Abrir Projeto Interativo</span>
                        </a>
                    </div>
                    <div class="card-content">
                        <span class="card-title" title="${project.title}">${project.title}</span>
                        <div class="card-actions">
                            <a href="${project.originalUrl}" target="_blank" class="btn-open" title="Ver no Tinkercad">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            </a>
                            <button class="btn-delete" onclick="deleteProject(${project.id})" title="Excluir projeto">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
