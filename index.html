<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio Tinkercad</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #202024;
            --primary: #00875f;
            --primary-hover: #00b37e;
            --danger: #f75a68;
            --text: #e1e1e6;
            --text-secondary: #8d8d99;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary-hover);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
        }

        /* Formulário de Adicionar Projeto */
        .form-container {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 3rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .form-container h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .input-group {
                flex-direction: row;
            }
        }

        input {
            flex: 1;
            padding: 0.8rem;
            border-radius: 6px;
            border: 1px solid #323238;
            background-color: #121214;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.btn-add {
            padding: 0.8rem 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-add:hover {
            background-color: var(--primary-hover);
        }

        /* Grid de Projetos */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid #323238;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #000;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .card-content {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn-delete {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        .empty-message {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu Portfólio Tinkercad</h1>
        <p>Projetos 3D e Circuitos interativos</p>
    </header>

    <!-- Form para adicionar novos links -->
    <div class="form-container">
        <h2>Adicionar Novo Projeto</h2>
        <form id="project-form" class="input-group">
            <input type="text" id="project-title" placeholder="Nome do Projeto (Ex: Robô Seguidor de Linha)" required>
            <input type="url" id="project-url" placeholder="Link de Incorporação (Embed) do Tinkercad" required>
            <button type="submit" class="btn-add">Adicionar</button>
        </form>
    </div>

    <!-- Container dos Projetos -->
    <main class="projects-grid" id="projects-container">
        <!-- Os projetos cadastrados aparecerão aqui -->
    </main>

    <script>
        const form = document.getElementById('project-form');
        const container = document.getElementById('projects-container');

        // Carrega projetos do localStorage ao abrir a página
        document.addEventListener('DOMContentLoaded', loadProjects);

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('project-title').value;
            let url = document.getElementById('project-url').value;

            // Tratamento simples para garantir que a URL seja tratada como Embed se for um link normal
            if (url.includes('tinkercad.com/things/') && !url.includes('/embed')) {
                url = url.replace(/\/things\/([^\/-]+).*/, '/embed/$1');
            }

            const newProject = {
                id: Date.now(),
                title: title,
                url: url
            };

            saveProject(newProject);
            form.reset();
        });

        // Função para salvar no LocalStorage
        function saveProject(project) {
            const projects = getProjectsFromStorage();
            projects.push(project);
            localStorage.setItem('tinkercad_projects', JSON.stringify(projects));
            renderProjects();
        }

        // Função para carregar do LocalStorage
        function getProjectsFromStorage() {
            return JSON.parse(localStorage.getItem('tinkercad_projects')) || [];
        }

        // Função para remover do LocalStorage
        function deleteProject(id) {
            let projects = getProjectsFromStorage();
            projects = projects.filter(project => project.id !== id);
            localStorage.setItem('tinkercad_projects', JSON.stringify(projects));
            renderProjects();
        }

        // Renderizar na tela
        function renderProjects() {
            container.innerHTML = '';
            const projects = getProjectsFromStorage();

            if (projects.length === 0) {
                container.innerHTML = '<p class="empty-message">Nenhum projeto adicionado ainda. Use o formulário acima para adicionar!</p>';
                return;
            }

            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="iframe-container">
                        <iframe src="${project.url}" frameborder="0" marginwidth="0" marginheight="0" scrolling="no"></iframe>
                    </div>
                    <div class="card-content">
                        <span class="card-title">${project.title}</span>
                        <button class="btn-delete" onclick="deleteProject(${project.id})">Excluir</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
